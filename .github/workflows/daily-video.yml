name: HDL Daily YouTube Teaser

on:
  schedule:
    # 09:15 UTC daily — after the article-engine cron (keeps API calls spread out)
    - cron: "15 9 * * *"
  workflow_dispatch: {} # lets you trigger a manual test run from the GitHub app/site

concurrency:
  group: hdl-daily-video
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated videos-manifest.json back to the repo

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # raised from 45 — more scenes (36-46 base, plus possible duration top-up rounds) and Kokoro's local CPU synthesis both add runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Generate + upload today's video
        run: npm run generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }} # optional now — Kokoro (local) is primary; this is a fallback
          # Optional — omit to use Fish Audio's default voice (only matters if the fallback runs)
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          # Optional: set to "true" to upload as Private instead of Public while you're testing
          DRY_RUN_PRIVATE: ${{ vars.DRY_RUN_PRIVATE }}

      # Commits the manifest update AND today's community-post draft (image + caption text,
      # written by community-post.js) even if the main step above exited non-zero — that step
      # intentionally throws AFTER publishing (see VOICE_FAILURE_THRESHOLD in generate-video.js)
      # just to redden the Actions check, so the video/manifest/post draft can all be live already.
      - name: Commit updated video manifest + community post draft
        if: always()
        run: |
          git config user.name "hdl-daily-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos-manifest.json community-posts/ 2>/dev/null || true
          if [ -n "$(git status --porcelain videos-manifest.json community-posts/ 2>/dev/null)" ]; then
            git commit -m "Update videos-manifest.json + today's community post draft [skip ci]"
            git push
          else
            echo "No manifest/community-post changes to commit."
          fi

      - name: Upload run artifacts (for debugging, kept 3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-run-${{ github.run_number }}
          path: |
            build/
            community-posts/
          retention-days: 3
          if-no-files-found: ignore
