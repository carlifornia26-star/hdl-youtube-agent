name: HDL Daily YouTube Teaser

on:
  schedule:
    # --- Channel 1 — 2:15 PM Eastern (existing) ---
    - cron: "15 18 * * *" # EDT (UTC-4), Mar-Nov
    - cron: "15 19 * * *" # EST (UTC-5), Nov-Mar

    # --- Channel 2 — 6:20 PM Eastern (US audience) ---
    - cron: "20 22 * * *" # EDT (UTC-4)
    - cron: "20 23 * * *" # EST (UTC-5)

    # --- Channel 3 — 8:00 PM Eastern (US audience) ---
    - cron: "0 0 * * *"   # EDT (UTC-4) — lands 00:00 UTC the next calendar day
    - cron: "0 1 * * *"   # EST (UTC-5)

  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to run manually"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]

concurrency:
  group: hdl-daily-video
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated videos-manifest.json back to the repo

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve channel + check DST alignment
        id: resolve
        run: |
          # Maps this run's trigger to a channel. All three channels target a US audience and
          # are anchored to fixed US Eastern local times, so each needs both an EDT and EST
          # cron entry — the offset check below picks whichever one actually matches today.
          OFFSET=$(TZ="America/New_York" date +%z)
          SCHEDULE="${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "15 18 * * *") CHANNEL=1; EXPECTED="-0400" ;;
              "15 19 * * *") CHANNEL=1; EXPECTED="-0500" ;;
              "20 22 * * *") CHANNEL=2; EXPECTED="-0400" ;;
              "20 23 * * *") CHANNEL=2; EXPECTED="-0500" ;;
              "0 0 * * *")   CHANNEL=3; EXPECTED="-0400" ;;
              "0 1 * * *")   CHANNEL=3; EXPECTED="-0500" ;;
            esac

            if [ "$OFFSET" = "$EXPECTED" ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Skipping — current US Eastern offset is $OFFSET, doesn't match this cron slot. The other scheduled trigger for this channel handles today's run."
            fi
          fi

          # Secret names aren't a consistent prefix+suffix pattern (channel 1 kept its
          # original YT_ names, channels 2/3 were saved as YOUTUBE_..._2 / _3), so map
          # each channel to its exact secret names explicitly rather than formatting one.
          case "$CHANNEL" in
            1)
              ID_KEY="YT_CLIENT_ID"; SECRET_KEY="YT_CLIENT_SECRET"; TOKEN_KEY="YT_REFRESH_TOKEN" ;;
            2)
              ID_KEY="YOUTUBE_CLIENT_ID_2"; SECRET_KEY="YOUTUBE_CLIENT_SECRET_2"; TOKEN_KEY="YOUTUBE_REFRESH_TOKEN_2" ;;
            3)
              ID_KEY="YOUTUBE_CLIENT_ID_3"; SECRET_KEY="YOUTUBE_CLIENT_SECRET_3"; TOKEN_KEY="YOUTUBE_REFRESH_TOKEN_3" ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "id_key=$ID_KEY" >> "$GITHUB_OUTPUT"
          echo "secret_key=$SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "token_key=$TOKEN_KEY" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: steps.resolve.outputs.proceed == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: steps.resolve.outputs.proceed == 'true'
        run: npm install

      - name: Generate + upload today's video (Channel ${{ steps.resolve.outputs.channel }})
        if: steps.resolve.outputs.proceed == 'true'
        run: npm run generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Pulls the exact secret matching this run's resolved channel into the
          # plain names the script already expects — no script changes needed for auth.
          YT_CLIENT_ID: ${{ secrets[steps.resolve.outputs.id_key] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.resolve.outputs.secret_key] }}
          YT_REFRESH_TOKEN: ${{ secrets[steps.resolve.outputs.token_key] }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }} # optional now — Kokoro (local) is primary; this is a fallback
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          DRY_RUN_PRIVATE: ${{ vars.DRY_RUN_PRIVATE }}
          CHANNEL_ID: ${{ steps.resolve.outputs.channel }}
          YT_VIDEO_LOCATION_DESCRIPTION: ${{ vars.YT_VIDEO_LOCATION_DESCRIPTION }}

      - name: Commit updated video manifest + community post draft
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          git config user.name "hdl-daily-video-bot"
          git config user.email "actions@users.noreply.github.com"
          CH="${{ steps.resolve.outputs.channel }}"
          MANIFEST="videos-manifest.json"
          if [ "$CH" != "1" ]; then MANIFEST="videos-manifest-$CH.json"; fi
          git add "$MANIFEST" community-posts/ 2>/dev/null || true
          if [ -n "$(git status --porcelain "$MANIFEST" community-posts/ 2>/dev/null)" ]; then
            git commit -m "Update $MANIFEST + today's community post draft (channel $CH) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No manifest/community-post changes to commit."
          fi

      - name: Upload run artifacts (for debugging, kept 3 days)
        if: always() && steps.resolve.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-run-${{ github.run_number }}-ch${{ steps.resolve.outputs.channel }}
          path: |
            build/
            community-posts/
          retention-days: 3
          if-no-files-found: ignore
