name: HDL Daily YouTube Teaser

on:
  schedule:
    # All 3 channels target the SAME daily publish moment — 16:00:00 UTC, matching the exact
    # publish time found on MrBeast's videos in competitor analysis (16:00:0X UTC on all 4
    # samples). Trigger times below are NOT that publish time — they're staggered earlier so each
    # channel's render/TTS/translate/upload pipeline has time to finish before 16:00 UTC, and
    # publishVideo() then holds the video at `private` with a scheduled `publishAt` of 16:00 UTC
    # rather than going public the moment the run finishes (see the "Compute publish target" step
    # below and publishVideo() in youtube.js). Spaced 2 hours apart — this repo's own
    # `concurrency` group below serializes all 3 channels onto one runner slot, and each run's
    # own timeout-minutes is 120, so a 2-hour gap keeps channel 2/3 from ever queuing behind an
    # unusually long channel 1/2 run and missing the shared 16:00 UTC target.
    #
    # Fixed in UTC now, not US Eastern — the previous EDT/EST cron-pair + offset-check dance
    # existed only to keep a fixed US Eastern wall-clock trigger time across DST changes. That's
    # no longer the goal (the goal is a fixed UTC publish time, matching a competitor who
    # publishes at a fixed UTC time year-round), so that whole DST mechanism is removed below —
    # one plain UTC cron per channel is now sufficient.
    - cron: "0 9 * * *"  # Channel 1 trigger — 09:00 UTC (7h buffer before the 16:00 UTC publish target)
    - cron: "0 11 * * *" # Channel 2 trigger — 11:00 UTC (5h buffer)
    - cron: "0 13 * * *" # Channel 3 trigger — 13:00 UTC (3h buffer)

  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to run manually"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]

concurrency:
  group: hdl-daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:
      - name: Checkout latest repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository version being used
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "HDL DAILY VIDEO — REPOSITORY VERSION"
          echo "=========================================="

          echo "Repository SHA:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current || true

          echo "Last commit:"
          git log -1 --pretty=format:'%h %ci %s'

          echo
          echo "=========================================="

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve channel
        id: resolve
        run: |
          set -euo pipefail

          SCHEDULE="${{ github.event.schedule }}"
          CHANNEL=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            echo "Manual run selected."
          else
            # One plain UTC cron per channel now (see the `on.schedule` comment above for why
            # the old EDT/EST DST-pair dance is gone) — a straight lookup, no offset check needed.
            case "$SCHEDULE" in
              "0 9 * * *")  CHANNEL=1 ;;
              "0 11 * * *") CHANNEL=2 ;;
              "0 13 * * *") CHANNEL=3 ;;
              *)
                echo "Unknown schedule: $SCHEDULE"
                exit 1
                ;;
            esac
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANNEL" ]; then
            echo "Channel could not be resolved."
            exit 1
          fi

          case "$CHANNEL" in
            1)
              ID_KEY="YT_CLIENT_ID"
              SECRET_KEY="YT_CLIENT_SECRET"
              TOKEN_KEY="YT_REFRESH_TOKEN"
              ;;
            2)
              ID_KEY="YOUTUBE_CLIENT_ID_2"
              SECRET_KEY="YOUTUBE_CLIENT_SECRET_2"
              TOKEN_KEY="YOUTUBE_REFRESH_TOKEN_2"
              ;;
            3)
              ID_KEY="YOUTUBE_CLIENT_ID_3"
              SECRET_KEY="YOUTUBE_CLIENT_SECRET_3"
              TOKEN_KEY="YOUTUBE_REFRESH_TOKEN_3"
              ;;
            *)
              echo "Invalid channel: $CHANNEL"
              exit 1
              ;;
          esac

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "id_key=$ID_KEY" >> "$GITHUB_OUTPUT"
          echo "secret_key=$SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "token_key=$TOKEN_KEY" >> "$GITHUB_OUTPUT"

          echo "Resolved channel: $CHANNEL"

          # Fixed daily PUBLISH moment — the SAME clock time for all 3 channels, matching the
          # exact UTC time found on MrBeast's videos in competitor analysis (16:00:0X UTC on all
          # 4 samples, year-round — his isn't Eastern-fixed, it's UTC-fixed). Trigger time (above,
          # in `on.schedule`) only starts the pipeline; publishVideo() in youtube.js holds the
          # video at `private` with this as its scheduled `publishAt` so the actual public
          # timestamp is always 16:00:00 UTC regardless of how long that day's render took.
          echo "publish_hour_utc=16" >> "$GITHUB_OUTPUT"
          echo "publish_minute_utc=0" >> "$GITHUB_OUTPUT"
          echo "Scheduled publish target: 16:00 UTC (all channels)"

      - name: Install ffmpeg
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          npm ci

      - name: Validate current weekly keyword file
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING ACTIVE WEEKLY KEYWORDS"
          echo "=========================================="

          node scripts/validate-weekly-keywords.js
          node scripts/validate-daily-keywords.js

      - name: Display active keyword version
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");

          const file = "keywords-weekly.json";

          if (!fs.existsSync(file)) {
            console.error(`${file} does not exist.`);
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          console.log("==========================================");
          console.log("ACTIVE WEEKLY KEYWORDS");
          console.log("==========================================");

          console.log("updatedAt:", data.updatedAt || "N/A");
          console.log("week:", data.week || data.weekStart || "N/A");

          if (data.generatedAt) {
            console.log("generatedAt:", data.generatedAt);
          }

          const channelKeywords =
            data.channelKeywords ||
            data.finalChannelKeywords ||
            data.keywords ||
            "";

          console.log(
            "Channel keyword characters:",
            String(channelKeywords).length
          );

          if (Array.isArray(data.googleTrends)) {
            console.log(
              "Google Trends terms:",
              data.googleTrends.length
            );
          }

          if (Array.isArray(data.youtubeTrending)) {
            console.log(
              "YouTube trending terms:",
              data.youtubeTrending.length
            );
          }

          if (Array.isArray(data.finalVideoTags)) {
            console.log(
              "Final video tags:",
              data.finalVideoTags.length
            );
          }

          if (Array.isArray(data.finalShortTags)) {
            console.log(
              "Final Short tags:",
              data.finalShortTags.length
            );
          }

          console.log("==========================================");
          NODE

      - name: Generate + upload today's video
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING HDL DAILY GENERATION"
          echo "=========================================="

          echo "Channel: $CHANNEL_ID"
          echo "Repository SHA: $(git rev-parse HEAD)"

          npm run generate

          echo "=========================================="
          echo "HDL DAILY GENERATION FINISHED"
          echo "=========================================="
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

          YT_CLIENT_ID: ${{ secrets[steps.resolve.outputs.id_key] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.resolve.outputs.secret_key] }}
          YT_REFRESH_TOKEN: ${{ secrets[steps.resolve.outputs.token_key] }}

          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}

          DRY_RUN_PRIVATE: ${{ vars.DRY_RUN_PRIVATE }}
          CHANNEL_ID: ${{ steps.resolve.outputs.channel }}
          YT_VIDEO_LOCATION_DESCRIPTION: ${{ vars.YT_VIDEO_LOCATION_DESCRIPTION }}
          PUBLISH_HOUR_UTC: ${{ steps.resolve.outputs.publish_hour_utc }}
          PUBLISH_MINUTE_UTC: ${{ steps.resolve.outputs.publish_minute_utc }}

      - name: Verify generated repository state
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "POST-UPLOAD STATE CHECK"
          echo "=========================================="

          CH="${{ steps.resolve.outputs.channel }}"

          MANIFEST="videos-manifest.json"
          CLIP_HISTORY="used-clips.json"

          if [ "$CH" != "1" ]; then
            MANIFEST="videos-manifest-$CH.json"
            CLIP_HISTORY="used-clips-$CH.json"
          fi

          echo "Channel: $CH"
          echo "Manifest: $MANIFEST"
          echo "Clip history: $CLIP_HISTORY"

          if [ -f "$MANIFEST" ]; then
            echo "Manifest exists: YES"
          else
            echo "Manifest exists: NO"
          fi

          if [ -f "$CLIP_HISTORY" ]; then
            echo "Clip history exists: YES"
          else
            echo "Clip history exists: NO"
          fi

          if [ -f "keywords-weekly.json" ]; then
            echo "Weekly keyword file exists: YES"
          else
            echo "Weekly keyword file exists: NO"
          fi

          echo
          echo "Git changes:"
          git status --short || true

      - name: Write daily automation health record
        if: always() && steps.resolve.outputs.proceed == 'true'
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          mkdir -p automation-health

          node - <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const channel = process.env.CHANNEL;
          const jobStatus = process.env.JOB_STATUS;

          let keywordData = null;

          try {
            keywordData = JSON.parse(
              fs.readFileSync("keywords-weekly.json", "utf8")
            );
          } catch (error) {
            console.error(
              "Could not read keywords-weekly.json:",
              error.message
            );
          }

          let commitSha = "";

          try {
            commitSha = execSync(
              "git rev-parse HEAD",
              { encoding: "utf8" }
            ).trim();
          } catch {}

          const record = {
            channel,
            status: jobStatus,
            checkedAt: new Date().toISOString(),
            repositoryCommitSha: commitSha,
            keywordFile: {
              updatedAt: keywordData?.updatedAt || null,
              week:
                keywordData?.week ||
                keywordData?.weekStart ||
                null
            },
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runNumber: process.env.GITHUB_RUN_NUMBER,
            eventName: process.env.GITHUB_EVENT_NAME
          };

          const file =
            `automation-health/daily-channel-${channel}.json`;

          fs.writeFileSync(
            file,
            JSON.stringify(record, null, 2) + "\n"
          );

          console.log(
            JSON.stringify(record, null, 2)
          );
          NODE

      - name: Commit updated video state + health
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          git config user.name "hdl-daily-video-bot"
          git config user.email "actions@users.noreply.github.com"

          CH="${{ steps.resolve.outputs.channel }}"

          MANIFEST="videos-manifest.json"
          CLIP_HISTORY="used-clips.json"

          if [ "$CH" != "1" ]; then
            MANIFEST="videos-manifest-$CH.json"
            CLIP_HISTORY="used-clips-$CH.json"
          fi

          git add \
            "$MANIFEST" \
            "$CLIP_HISTORY" \
            community-posts/ \
            automation-health/ \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
            exit 0
          fi

          git commit \
            -m "Update daily upload state and health (channel $CH) [skip ci]"

          for attempt in 1 2 3; do
            echo "Git push attempt $attempt..."

            if git push; then
              echo "Git push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push failed. Synchronizing with origin/main..."

              git fetch origin main

              git rebase origin/main || {
                echo "Rebase failed."
                exit 1
              }
            fi
          done

          echo "Git push failed after 3 attempts."
          exit 1

      - name: Upload run artifacts
        if: always() && steps.resolve.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-run-${{ github.run_number }}-ch${{ steps.resolve.outputs.channel }}
          path: |
            build/
            community-posts/
            automation-health/
          retention-days: 3
          if-no-files-found: ignore

      - name: Final daily status
        if: always() && steps.resolve.outputs.proceed == 'true'
        run: |
          echo "=========================================="
          echo "HDL DAILY UPLOAD SUMMARY"
          echo "=========================================="
          echo "Channel: ${{ steps.resolve.outputs.channel }}"
          echo "Repository SHA: $(git rev-parse HEAD)"

          if [ -f keywords-weekly.json ]; then
            node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("keywords-weekly.json", "utf8")
          );

          console.log(
            "Keyword week:",
            data.week ||
            data.weekStart ||
            "N/A"
          );

          console.log(
            "Keyword updatedAt:",
            data.updatedAt ||
            "N/A"
          );
          NODE
          fi

          echo "Workflow job status: ${{ job.status }}"
          echo "=========================================="
