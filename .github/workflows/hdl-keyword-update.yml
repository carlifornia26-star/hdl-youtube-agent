name: HDL Weekly Keyword Update

on:
  schedule:
    # 05:00 South Africa Standard Time (UTC+2) every Monday
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hdl-weekly-keyword-update
  cancel-in-progress: false

jobs:
  generate-keywords:
    name: Generate weekly keywords
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
      keyword_file_valid: ${{ steps.validate.outputs.valid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly keywords
        id: generate
        run: |
          set -euo pipefail
          node scripts/update-keywords.js

      - name: Validate weekly keyword file
        id: validate
        run: |
          set -euo pipefail
          node scripts/validate-weekly-keywords.js

      - name: Show generated keyword information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "HDL WEEKLY KEYWORD UPDATE"
          echo "=========================================="

          if [ -f keywords-weekly.json ]; then
            node - <<'NODE'
            const fs = require("fs");

            const data = JSON.parse(
              fs.readFileSync("keywords-weekly.json", "utf8")
            );

            console.log("updatedAt:", data.updatedAt || "N/A");
            console.log("week:", data.week || data.weekStart || "N/A");

            const channelKeywords =
              data.channelKeywords ||
              data.finalChannelKeywords ||
              data.keywords ||
              "";

            console.log(
              "channel keyword characters:",
              String(channelKeywords).length
            );

            if (Array.isArray(data.googleTrends)) {
              console.log(
                "Google Trends terms:",
                data.googleTrends.length
              );
            }

            if (Array.isArray(data.youtubeTrending)) {
              console.log(
                "YouTube trending terms:",
                data.youtubeTrending.length
              );
            }

            if (Array.isArray(data.finalVideoTags)) {
              console.log(
                "Final video tags:",
                data.finalVideoTags.length
              );
            }

            if (Array.isArray(data.finalShortTags)) {
              console.log(
                "Final Short tags:",
                data.finalShortTags.length
              );
            }
            NODE
          fi

      - name: Create weekly keyword history snapshot
        run: |
          set -euo pipefail

          mkdir -p keyword-history

          DATE="$(date -u +'%Y-%m-%d')"
          DEST="keyword-history/${DATE}.json"

          if [ -e "$DEST" ]; then
            DEST="keyword-history/${DATE}-${GITHUB_RUN_ID}.json"
          fi

          cp keywords-weekly.json "$DEST"

          echo "Created keyword history:"
          echo "$DEST"

      - name: Commit keyword state
        id: commit
        run: |
          set -euo pipefail

          git config user.name "HDL YouTube Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keywords-weekly.json keyword-history/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No keyword repository changes detected."
            exit 0
          fi

          git commit \
            -m "chore: update weekly YouTube keywords $(date -u +'%Y-%m-%d')"

          echo "changed=true" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            if git push; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push failed; synchronizing before retry..."
              git fetch origin main
              git rebase origin/main || {
                echo "Rebase failed."
                exit 1
              }
            fi
          done

          echo "Unable to push after 3 attempts."
          exit 1

  apply-channel-keywords:
    name: Update Channel ${{ matrix.channel }}
    needs: generate-keywords
    if: needs.generate-keywords.result == 'success'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        channel: ["1", "2", "3"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate keyword file
        run: |
          set -euo pipefail
          node scripts/validate-weekly-keywords.js

      - name: Update and verify Channel ${{ matrix.channel }}
        env:
          CHANNEL: ${{ matrix.channel }}
          YOUTUBE_CLIENT_ID: ${{ matrix.channel == '1' && secrets.YOUTUBE_CLIENT_ID || matrix.channel == '2' && secrets.YOUTUBE_CLIENT_ID_2 || secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET: ${{ matrix.channel == '1' && secrets.YOUTUBE_CLIENT_SECRET || matrix.channel == '2' && secrets.YOUTUBE_CLIENT_SECRET_2 || secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN: ${{ matrix.channel == '1' && secrets.YOUTUBE_REFRESH_TOKEN || matrix.channel == '2' && secrets.YOUTUBE_REFRESH_TOKEN_2 || secrets.YOUTUBE_REFRESH_TOKEN_3 }}
        run: |
          set -euo pipefail

          echo "Updating YouTube Channel ${CHANNEL}..."

          node scripts/customize-channel.js --channel "$CHANNEL"

          echo "Channel ${CHANNEL}: SUCCESS — update command completed."

      - name: Write channel health record
        if: always()
        env:
          CHANNEL: ${{ matrix.channel }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          mkdir -p automation-health

          node - <<'NODE'
          const fs = require("fs");

          const channel = process.env.CHANNEL;
          const status = process.env.JOB_STATUS;

          const file = `automation-health/channel-${channel}.json`;

          const record = {
            channel,
            status,
            checkedAt: new Date().toISOString(),
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            commitSha: process.env.GITHUB_SHA
          };

          fs.writeFileSync(
            file,
            JSON.stringify(record, null, 2) + "\n"
          );

          console.log(JSON.stringify(record, null, 2));
          NODE

      - name: Commit channel health record
        if: always()
        run: |
          set -euo pipefail

          git config user.name "HDL YouTube Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation-health/

          if git diff --cached --quiet; then
            echo "No health changes."
            exit 0
          fi

          git commit \
            -m "chore: record Channel ${{ matrix.channel }} keyword update health"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git rebase origin/main || exit 1
            fi
          done

          exit 1

  weekly-summary:
    name: Weekly keyword update summary
    needs: apply-channel-keywords
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Print final summary
        env:
          RESULT: ${{ needs.apply-channel-keywords.result }}
        run: |
          echo "=========================================="
          echo "HDL WEEKLY KEYWORD UPDATE COMPLETE"
          echo "=========================================="
          echo "Channel jobs result: ${RESULT}"
          echo "Channel 1: check the Channel 1 job"
          echo "Channel 2: check the Channel 2 job"
          echo "Channel 3: check the Channel 3 job"
          echo "=========================================="

          if [ "${RESULT}" != "success" ]; then
            echo "Overall status: FAILED"
            exit 1
          fi

          echo "Overall status: SUCCESS"
