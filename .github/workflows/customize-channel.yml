name: HDL Channel Localization + Keywords (manual)

# Manual only — the channel name/description/keywords don't change often, so this doesn't need
# a daily cron like the video pipeline. Trigger it from the Actions tab (or the GitHub mobile
# app: repo -> Actions -> this workflow -> Run workflow) whenever you want to (re)translate the
# channel's name + description into every language YouTube supports and refresh the channel
# Keywords field, or after you've edited the default English name/description in Studio.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to localize"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]

jobs:
  localize-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Resolve channel secrets
        id: resolve
        run: |
          # Same secret-name mapping as daily-video.yml: channel 1 kept its original YT_ names,
          # channels 2/3 were saved as YOUTUBE_..._2 / _3.
          case "${{ github.event.inputs.channel }}" in
            1)
              echo "id_key=YT_CLIENT_ID" >> "$GITHUB_OUTPUT"
              echo "secret_key=YT_CLIENT_SECRET" >> "$GITHUB_OUTPUT"
              echo "token_key=YT_REFRESH_TOKEN" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "id_key=YOUTUBE_CLIENT_ID_2" >> "$GITHUB_OUTPUT"
              echo "secret_key=YOUTUBE_CLIENT_SECRET_2" >> "$GITHUB_OUTPUT"
              echo "token_key=YOUTUBE_REFRESH_TOKEN_2" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "id_key=YOUTUBE_CLIENT_ID_3" >> "$GITHUB_OUTPUT"
              echo "secret_key=YOUTUBE_CLIENT_SECRET_3" >> "$GITHUB_OUTPUT"
              echo "token_key=YOUTUBE_REFRESH_TOKEN_3" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Translate name/description + set channel keywords (Channel ${{ github.event.inputs.channel }})
        run: npm run customize-channel
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets[steps.resolve.outputs.id_key] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.resolve.outputs.secret_key] }}
          YT_REFRESH_TOKEN: ${{ secrets[steps.resolve.outputs.token_key] }}
          CHANNEL_COUNTRY: ${{ vars.CHANNEL_COUNTRY }}
