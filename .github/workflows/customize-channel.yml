name: HDL Channel Localization (manual)

# Manual only — the channel name/description don't change often, so this doesn't need a daily
# cron like the video pipeline. Trigger it from the Actions tab (or the GitHub mobile app:
# repo -> Actions -> this workflow -> Run workflow) whenever you want to (re)translate the
# channel's name + description into every language YouTube supports, or after you've edited
# the default English name/description in Studio.
on:
  workflow_dispatch: {}

jobs:
  localize-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Translate + set channel name/description in every supported language
        run: npm run customize-channel
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
