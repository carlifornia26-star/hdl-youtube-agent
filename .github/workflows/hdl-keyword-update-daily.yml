name: HDL Daily Keyword Update

# Every day 5:00 PM Africa/Johannesburg (SAST, UTC+2 all year — no DST) = 15:00 UTC.
# If you're running this from a different timezone, change the cron below to (your 5pm) minus
# your UTC offset.
#
# This is the DAILY half of a two-schedule keyword pipeline — see also hdl-keyword-update.yml
# (Monday 5am SAST). The 5 fixed keywords never change, and the weekly workflow locks in 2
# trending words for the whole week right after them. This workflow computes the REST of the
# trending pool — everything after the fixed 5 + weekly 2 — fresh every day.
#
# ONE phase now: compute-keywords fetches worldwide Google Trends + YouTube's own trending
# chart (same sources as the weekly workflow, see scripts/update-keywords.js), ranks every term,
# excludes whatever this week's locked-in top 2 already are, and commits keywords-daily.json
# with the rest. generate-video.js reads this file (plus keywords-weekly.json) every day and
# folds fixed + weekly-2 + daily-rest into that day's video/Short `tags` — the only place these
# keywords now reach YouTube.
#
# REMOVED (2026-09-11): this workflow used to have a second job, apply-channel-keywords, which
# pushed the combined keyword string to each of the 3 channels' brandingSettings.channel.keywords
# field (the "Channel Keywords" SEO setting in YouTube Studio) via the YouTube API. It's been
# removed by request — it was the recurring source of "Neither keywords-weekly.json nor
# keywords-daily.json found" failures (a checkout-timing race against the compute job earlier in
# the same run), and channel-level keywords aren't shown to viewers anywhere either, so removing
# this doesn't lose any public-facing SEO value. If you ever want channel-level keywords back,
# the removed job (and the setChannelKeywords call it used in scripts/update-keywords.js) is
# recoverable from git history.
on:
  schedule:
    - cron: "0 15 * * *" # every day 15:00 UTC = 17:00 SAST (Africa/Johannesburg)
  workflow_dispatch: {} # manual trigger — Actions tab -> this workflow -> Run workflow

permissions:
  contents: write # needed to commit keyword state/history/health back to the repo

# Never allow two daily keyword runs to mutate the same active file at once. Manual runs
# are allowed, but a second run waits rather than cancelling the first.
concurrency:
  group: hdl-daily-keywords
  cancel-in-progress: false

jobs:
  compute-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Fetch trends + write keywords-daily.json (the rest)
        run: npm run update-keywords
        env:
          KEYWORDS_MODE: compute-daily
          # Needed for translateTermToEnglish (cf-ai.js) — the same Cloudflare Workers AI
          # credentials every other script here already uses for translation.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Channel 1's credentials are used for the YouTube trending-chart lookups (videos.list
          # is a read of PUBLIC data — any authenticated channel works, this just reuses the
          # existing channel-1 secrets rather than adding new ones for a read-only call).
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Commit daily keyword state
        run: |
          set -e
          git config user.name "hdl-keyword-update-bot"
          git config user.email "actions@users.noreply.github.com"

          # The compute script writes BOTH the active file and a dated history snapshot.
          git add keywords-daily.json keyword-history/ 2>/dev/null || true

          if [ -z "$(git status --porcelain)" ]; then
            echo "No daily keyword state changes to commit."
            exit 0
          fi

          git commit -m "Update daily trending keyword state [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              echo "Daily keyword state pushed successfully on attempt $attempt/3."
              exit 0
            fi
            echo "Push attempt $attempt/3 failed; retrying..."
            sleep $((attempt * 5))
          done

          echo "Unable to push daily keyword state after 3 attempts."
          exit 1

  finalize-daily-health:
    if: always()
    needs: [compute-keywords]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Record daily automation health
        run: |
          set -e
          mkdir -p automation-health
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SHA="$(git rev-parse HEAD)"
          KEYWORDS_STATUS="unknown"
          UPDATED_AT=""
          if [ -f keywords-daily.json ]; then
            UPDATED_AT="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("keywords-daily.json","utf8")); process.stdout.write(d.updatedAt || "")' 2>/dev/null || true)"
            KEYWORDS_STATUS="present"
          else
            KEYWORDS_STATUS="missing"
          fi

          cat > automation-health/daily.json <<EOF
          {
            "checkedAt": "$NOW",
            "overallStatus": "${{ needs['compute-keywords'].result == 'success' && 'success' || 'failed' }}",
            "computeStatus": "${{ needs['compute-keywords'].result }}",
            "keywordsFileStatus": "$KEYWORDS_STATUS",
            "keywordsUpdatedAt": "$UPDATED_AT",
            "repositorySha": "$SHA",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunNumber": "${{ github.run_number }}"
          }
          EOF

          echo "Daily health:"
          cat automation-health/daily.json

      - name: Commit daily health
        run: |
          set -e
          git config user.name "hdl-keyword-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation-health/daily.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No health-state change."
            exit 0
          fi
          git commit -m "Record daily keyword automation health [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              echo "Daily health pushed successfully on attempt $attempt/3."
              exit 0
            fi
            echo "Health push attempt $attempt/3 failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Unable to push daily health after 3 attempts."
          exit 1
