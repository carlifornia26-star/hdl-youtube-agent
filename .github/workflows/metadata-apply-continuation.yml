# CONTINUATION CANDIDATE - offline review only. The existing metadata-apply.yml
# stays disabled and untouched. REVIEWED_INPUT_SHA256 is pinned at activation
# time to the exact assembled private-input envelope (fresh evidence recipient,
# never the retired one); the placeholder makes this file non-runnable as-is.
name: Bounded private metadata apply continuation candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-metadata-maintenance
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply reviewed single-video ch1 localized metadata repair (mp5wp6GTpAE only)
        run: node maintenance/metadata-apply-main.js
        env:
          REPAIR_MODE: apply
          REPAIR_CHANNEL: '1'
          REVIEWED_INPUT_SHA256: '7f78b79a266bd5082c616a98c9e11d73e46451e664f698d48c35acd7a8f688de'
          YT_BOUNDED_METADATA_INPUT: ${{ secrets.YT_BOUNDED_METADATA_INPUT_CH1_CONTINUATION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-metadata-apply-continuation-${{ github.run_id }}
          path: metadata-apply-output/*.enc
          retention-days: 7
          if-no-files-found: warn
