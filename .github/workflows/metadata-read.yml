name: Bounded private metadata read candidate (mp5wp6GTpAE)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-metadata-maintenance
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read current localizations for one allowlisted video
        run: node maintenance/metadata-read-main.js
        env:
          # Single allowlisted video for this read. No free-text dispatch input.
          READ_VIDEO_ID: mp5wp6GTpAE
          # Recipient binding deferred to activation: a fresh task-only RSA-3072
          # recipient is generated near activation, its SPKI SHA-256 pinned here
          # and the public key stored in the secret below. The placeholder makes
          # this file non-runnable as-is.
          READ_EXPECTED_SPKI_SHA256: "6c6710d5762bf326cb6e27683e3d682318bf87bf9675a5265d4d84ca9902f994"
          READ_PUBLIC_KEY_PEM: ${{ secrets.METADATA_READ_PUBLIC_KEY_PEM }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-metadata-read-${{ github.run_id }}
          path: metadata-read-output/*.enc
          retention-days: 7
          if-no-files-found: warn
