name: HDL Setup Playlists

# Manual only (workflow_dispatch) — playlists only need creating once per book, not on a daily
# cron. Run it from the Actions tab once now, and again any time you add a new book to CATALOG
# in scripts/catalog.js. Existing playlists are skipped automatically, so re-running is safe.
on:
  workflow_dispatch: {}

jobs:
  setup:
    name: Create per-book playlists with localizations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run setup-playlists
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run setup-playlists

      - name: Commit playlists.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists.json
          git diff --staged --quiet || git commit -m "Add/update playlists.json"
          git push
