name: Bounded private metadata apply channel 1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-metadata-maintenance
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exactly one reviewed channel plan
        run: node maintenance/metadata-apply-main.js
        env:
          REPAIR_MODE: apply
          # Private reviewed candidate only. Deployment and enablement remain held.
          REPAIR_CHANNEL: '1'
          REVIEWED_INPUT_SHA256: 8f5eefc97189f2c6fe3b556645b255a2a90f9534952b5be2a287513204b5f219
          YT_BOUNDED_METADATA_INPUT: ${{ secrets.YT_BOUNDED_METADATA_INPUT }}
          # For one channel only: bind existing 1 OR 4 credentials during reviewed activation.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-metadata-evidence-${{ github.run_id }}
          path: metadata-apply-output/*.json.enc
          retention-days: 7
          if-no-files-found: warn
